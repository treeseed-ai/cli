schemaVersion: treeseed.guarantee-verifiers/v1
ownerPackage: "@treeseed/cli"
verifiers:
  cli.deployment.local-platform.workflow-deferral:
    kind: nodeScript
    ownerPackage: "@treeseed/cli"
    command: packages/cli/tests/unit/runtime/platform-supervisor-workflows.test.ts
    description: "The persistent platform supervisor checks worktree and shared workflow locks before each mutation and defers reconciliation when a workflow becomes active between phases."
  cli.capacity.assignment.forensic-reads-fail-visible:
    kind: nodeScript
    ownerPackage: "@treeseed/cli"
    command: packages/cli/tests/integration/capacity/forensics.test.ts
    description: "CLI forensic loaders preserve bounded assignment/mode-run evidence and propagate API failure instead of rendering an empty successful report."
  cli.capacity.assignment.reviewed-checkpoint-integration:
    kind: nodeScript
    ownerPackage: "@treeseed/cli"
    command: packages/cli/tests/integration/capacity/checkpoint.test.ts
    description: "Checkpoint integration requires explicit scope and mode; the SDK operation proves selected-manifest lineage, repository identity, divergence and supersession rejection, exact tree integration, and replay."
