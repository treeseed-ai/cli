schemaVersion: treeseed.guarantee-verifiers/v1
ownerPackage: "@treeseed/cli"
verifiers:
  cli.golden.source-bytes:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/command-boundary/development/source-closure.test.ts
    testName: development source digest binds same-size untracked binary bytes and newline paths
  cli.golden.source-mode:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/command-boundary/development/source-closure.test.ts
    testName: development source digest binds untracked executable mode and symbolic link identity
  cli.golden.source-ignore:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/command-boundary/development/source-closure.test.ts
    testName: development source digest retains tracked edits and ignores Git-excluded output
  cli.golden.source-unreadable:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/command-boundary/development/source-closure.test.ts
    testName: development source planning rejects unreadable untracked bytes without manager effects
  cli.golden.candidate-bytes:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/integration/development-candidate.test.ts
    testName: native candidate verification rejects untracked bytes changes without registering a pass
  cli.golden.candidate-mode:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/integration/development-candidate.test.ts
    testName: native candidate verification rejects untracked mode changes without registering a pass
  cli.golden.candidate-link:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/integration/development-candidate.test.ts
    testName: native candidate verification rejects untracked link changes without registering a pass
  cli.golden.candidate-deletion:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/integration/development-candidate.test.ts
    testName: native candidate verification rejects untracked deleted changes without registering a pass
  cli.golden.candidate-addition:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/integration/development-candidate.test.ts
    testName: native candidate verification rejects untracked added changes without registering a pass
  cli.golden.candidate-mutation:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/integration/development-candidate.test.ts
    testName: native candidate verification rejects untracked during verification changes without registering a pass
  cli.golden.dirty-candidate:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/integration/development-candidate.test.ts
    testName: native dirty candidate verification excludes generated artifact and remains non-promotable
  cli.golden.source-files:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/source-custody.test.ts
    testName: complete CLI source is readable owner files without undeclared external Git links
  cli.golden.source-checkout:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/integration/source-custody.test.ts
    testName: fresh native Git checkout materializes every CLI source entry without missing-directory sentinels
  cli.golden.sdk-agreement:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/dependency-sbom.test.ts
    testName: exact SDK artifact agrees with both dependency declarations before acceptance
  cli.golden.sbom-authority:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/dependency-sbom.test.ts
    testName: strict SBOM is generated once by release verification before tests and candidate sealing
  cli.golden.sbom-native:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/integration/dependency-sbom.test.ts
    testName: strict native SBOM accepts exact installed artifacts and refuses mismatched missing malformed dependencies
  cli.golden.workflow-triggers:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/contract/package/thin-package.test.ts
    testName: verification retains every PR protected branch and tag without duplicate topic pushes
  cli.golden.reporting-deadlines:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/native-suite-reporting.test.ts
    testName: native reporting cannot replace original suite deadlines or interrupt policy through reporting flags
  cli.golden.native-reporting:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/integration/native-suite-reporting.test.ts
    testName: native complete reporting preserves build discovery custody and nested subprocess defaults
  cli.golden.reporting-denial:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/integration/native-suite-reporting.test.ts
    testName: native reporter arguments reject filters unknown flags and malformed pairs before test side effects
  cli.golden.reporting-outcomes:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/integration/native-suite-reporting.test.ts
    testName: native reporting retains failed skipped todo empty and crashed suite outcomes
  cli.golden.reporting-unit:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/native-suite-reporting.test.ts
    testName: native reporting accepts only a complete nonempty reporting pair without test selection
  cli.golden.refused-rebuild:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/command-boundary/host/managed-development-container.test.ts
    testName: container startup and cleanup only invoke the protected manager, including failed-start cleanup
  cli.golden.allocations:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/command-boundary/workdays/selection.test.ts
    testName: high-level allocation options use one nested policy input
  cli.golden.selection:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/command-boundary/workdays/selection.test.ts
    testName: repeated and CSV selectors become a normalized intersecting nested intent
  cli.golden.decisions:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/command-boundary/workdays/selection.test.ts
    testName: repeated and CSV accepted decisions become one normalized selection
  cli.golden.decision-denial:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/command-boundary/workdays/selection.test.ts
    testName: empty decision selection never invokes the API
  cli.golden.input-isolation:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/command-boundary/workdays/selection.test.ts
    testName: nested bindings reject prototype traversal, collisions, and excessive depth
  cli.golden.diagnostics:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/command-boundary/communications/send-outcome.test.ts
    testName: streamed human sends retain failure reason and IDs without duplicating prior responses
  cli.golden.runtime-readback:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/command-boundary/development/lifecycle.test.ts
    testName: managed Agent sandbox status recognizes exact active guest-image custody
  cli.golden.lifecycle-lock:
    kind: nodeTestCase
    ownerPackage: "@treeseed/cli"
    testFile: tests/unit/command-boundary/development/lifecycle.test.ts
    testName: lifecycle lock releases after a failed operation
