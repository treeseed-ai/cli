name: Promote TreeSeed CLI Candidate

on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch:
    inputs:
      resume_tag:
        description: Exact already-published CLI candidate tag awaiting npm read-back and GitHub release
        required: true

jobs:
  promote:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions: { actions: read, contents: write, id-token: write }
    environment: ${{ contains(github.ref_name, '-') && 'staging' || 'production' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24, registry-url: https://registry.npmjs.org }
      - name: Download exact protected candidate
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then candidate_branch=staging; else candidate_branch=main; fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${candidate_branch}")"
          run_id="$(gh run list --workflow verify.yml --branch "$candidate_branch" --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          gh run download "$run_id" --name "cli-candidate-${GITHUB_SHA}" --dir candidate
      - name: Install exact published dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run release:check-tag
      - run: npm run release:custody -- verify candidate/release-evidence-v1.json
      - name: Capture stable tag before publication
        id: before
        run: echo "latest=$(npm view @treeseed/cli dist-tags.latest)" >> "$GITHUB_OUTPUT"
      - name: Publish accepted tarball directly
        run: npm run release:publish -- "$(find candidate -maxdepth 1 -name '*.tgz' -print -quit)"
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
      - name: Verify immutable npm read-back
        env:
          EXPECTED_LATEST: ${{ steps.before.outputs.latest }}
        run: |
          export EXPECTED_SHA256="$(node -e "const e=require('./candidate/release-evidence-v1.json'); process.stdout.write(e.artifacts.find(x=>x.kind==='npm-package').digest.slice(7))")"
          node --import tsx ./scripts/packages/verify-published-package.ts
      - name: Publish unchanged custody assets
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" candidate/*.tgz candidate/sbom.cdx.json candidate/release-evidence-v1.json --generate-notes --verify-tag "${flags[@]}"

  resume-readback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions: { actions: read, contents: write }
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24, registry-url: https://registry.npmjs.org }
      - name: Require exact accepted staging candidate
        env:
          TAG: ${{ inputs.resume_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/staging
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/publish.yml@refs/heads/staging"
          case "$TAG" in *-rc.*) :;; *) exit 1;; esac
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          candidate_sha="$(git rev-list -n 1 "$TAG")"
          git merge-base --is-ancestor "$candidate_sha" HEAD
          test "$(git show "$TAG:package.json" | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(value).version))")" = "$TAG"
          test "$(node -p "require('./package.json').version")" = "$TAG"
          run_id="$(gh run list --workflow verify.yml --branch staging --commit "$candidate_sha" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          gh run download "$run_id" --name "cli-candidate-$candidate_sha" --dir candidate
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify immutable npm tarball and unchanged latest tag
        env:
          TREESEED_RELEASE_TAG: ${{ inputs.resume_tag }}
        run: |
          set -euo pipefail
          export EXPECTED_SHA256="$(node -e "const e=require('./candidate/release-evidence-v1.json'); process.stdout.write(e.artifacts.find(x=>x.kind==='npm-package').digest.slice(7))")"
          export EXPECTED_LATEST="$(npm view @treeseed/cli dist-tags.latest)"
          node --import tsx ./scripts/packages/verify-published-package.ts
      - name: Publish unchanged accepted custody assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.resume_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite assets." >&2
            exit 1
          fi
          gh release create "$TAG" candidate/*.tgz candidate/sbom.cdx.json candidate/release-evidence-v1.json --generate-notes --verify-tag --prerelease
