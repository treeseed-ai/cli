name: Verify

on:
  push:
    branches: [staging, main]
    tags: ["**"]
    paths-ignore: ["docs/src/content/**"]
  pull_request:
    # Required verification must also run for ancestry-only reconciliation PRs.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TREESEED_STAGE_WAIT_MODE: skip
      TREESEED_AGENT_DISABLE_GIT: "true"
      TREESEED_TOOL_CLOSURE_OUTPUT: artifacts
      TREESEED_DEVELOPMENT_WORKSPACE_ROOT: ${{ github.workspace }}/.treeseed/platform-authority
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout exact canonical execution authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: treeseed-ai/platform
          ref: e4c4cad1e526f53d3549c8fc27c3e60122b20ee4
          path: .treeseed/platform-authority
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        timeout-minutes: 20
        run: npm ci --no-audit --no-fund

      - name: Install exact integrated SDK
        uses: treeseed-ai/sdk/.github/actions/install-exact-sdk@f43bd785c3d1caf4260c3e1f9d8d41b26b1cdb9b
        with:
          github-token: ${{ github.token }}

      - name: Verify package with exact SDK
        run: npm run verify:direct
      - name: Execute coded golden component scenes
        uses: treeseed-ai/reviewer/.github/actions/run-scenes@013d38165f0430278ac944592d3b20618736c2d5
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/tests/support/os-custody.mjs
        with:
          ids: guarantee.cli.golden.component-boundaries

      - name: Seal protected staging candidate
        if: github.ref == 'refs/heads/staging'
        run: |
          artifact="$(find artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          npm run release:custody -- seal artifacts/release-evidence-v1.json "$artifact"
          npm run release:custody -- verify artifacts/release-evidence-v1.json

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error

      - name: Upload sealed staging custody
        if: github.ref == 'refs/heads/staging'
        uses: actions/upload-artifact@v4
        with:
          name: cli-candidate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
