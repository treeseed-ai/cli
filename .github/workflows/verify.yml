name: Verify

on:
  push:
    branches: [staging, main]
    tags: ["**"]
    paths-ignore: ["docs/src/content/**"]
  pull_request:
    # Required verification must also run for ancestry-only reconciliation PRs.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TREESEED_STAGE_WAIT_MODE: skip
      TREESEED_AGENT_DISABLE_GIT: "true"
      TREESEED_TOOL_CLOSURE_OUTPUT: artifacts
      TREESEED_DEVELOPMENT_WORKSPACE_ROOT: ${{ github.workspace }}/.treeseed/platform-authority
      TREESEED_TEST_SDK_ARCHIVE: ${{ github.workspace }}/.treeseed/verified-sdk/treeseed-sdk-0.13.0-rc.122.tgz
      TREESEED_TEST_SDK_ARCHIVE_SHA256: ff7a7af40bfce7398f137eabcbf9212f2e8d8f3ddb18c9f152df8b76fdb8c9e3
      TREESEED_TEST_REVIEWER_ARCHIVE: ${{ github.workspace }}/.treeseed/verified-reviewer/treeseed-reviewer-0.1.0-rc.13.tgz
      TREESEED_TEST_REVIEWER_ARCHIVE_SHA256: 063ef40142eaf603a37c14082aad7a34d326aefeae40026cf684af8bdc4bc274
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout exact canonical execution authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: treeseed-ai/platform
          ref: e4c4cad1e526f53d3549c8fc27c3e60122b20ee4
          path: .treeseed/platform-authority
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        timeout-minutes: 20
        run: npm ci --no-audit --no-fund

      - name: Install exact integrated SDK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/sdk
          run-id: 38164849288
          name: sdk-ac5b9abd8a7e615d9ef5886e342859dd2b183d5e
          path: .treeseed/verified-sdk

      - name: Verify and install held SDK archive
        run: |
          set -euo pipefail
          mapfile -t archives < <(find .treeseed/verified-sdk -maxdepth 1 -type f -name '*.tgz')
          test "${#archives[@]}" -eq 1
          test "${archives[0]}" -ef "$TREESEED_TEST_SDK_ARCHIVE"
          echo "$TREESEED_TEST_SDK_ARCHIVE_SHA256  ${archives[0]}" | sha256sum --check --strict
          node --import tsx ./scripts/build/hydrate-exact-sdk.ts "${archives[0]}" "$TREESEED_TEST_SDK_ARCHIVE_SHA256"

      - name: Obtain exact production verifier archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/reviewer
          run-id: 38348410425
          name: reviewer-c04f1b295780d4758cbeee16a456d25272ec4b50
          path: .treeseed/verified-reviewer

      - name: Verify package with exact SDK
        run: npm run verify:direct
      - name: Execute coded golden component scenes
        uses: treeseed-ai/reviewer/.github/actions/run-scenes@e60ad2581e7ff041f058af04bd810796fea748f9
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/tests/support/os-custody.ts
        with:
          ids: guarantee.cli.golden.component-boundaries

      - name: Seal protected staging candidate
        if: github.ref == 'refs/heads/staging'
        run: |
          artifact="$(find artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          npm run release:custody -- seal artifacts/release-evidence-v1.json "$artifact"
          npm run release:custody -- verify artifacts/release-evidence-v1.json

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error

      - name: Upload sealed staging custody
        if: github.ref == 'refs/heads/staging'
        uses: actions/upload-artifact@v4
        with:
          name: cli-candidate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
