name: Verify

on:
  push:
    branches: [staging, main]
    tags: ["**"]
    paths-ignore: ["docs/src/content/**"]
  pull_request:
    paths-ignore: ["docs/src/content/**"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TREESEED_STAGE_WAIT_MODE: skip
      TREESEED_AGENT_DISABLE_GIT: "true"
      TREESEED_TOOL_CLOSURE_OUTPUT: artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        timeout-minutes: 20
        run: npm ci --no-audit --no-fund

      - name: Install exact integrated SDK
        uses: treeseed-ai/sdk/.github/actions/install-exact-sdk@a12f06dc33c02161cedb4d74928fb915a803911f
        with:
          github-token: ${{ github.token }}

      - name: Verify package with exact SDK
        run: npm run verify:direct
      - name: Execute coded golden component scenes
        uses: treeseed-ai/reviewer/.github/actions/run-scenes@c89d172577991af9beff41ea1977a5cd6d940215
        with:
          ids: guarantee.cli.golden.component-boundaries

      - name: Seal protected staging candidate
        if: github.ref == 'refs/heads/staging'
        run: |
          artifact="$(find artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          npm run release:custody -- seal artifacts/release-evidence-v1.json "$artifact"
          npm run release:custody -- verify artifacts/release-evidence-v1.json

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error

      - name: Upload sealed staging custody
        if: github.ref == 'refs/heads/staging'
        uses: actions/upload-artifact@v4
        with:
          name: cli-candidate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
